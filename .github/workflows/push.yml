name: V8 15.3.76.24 Linux x64 full seed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-linux-x64-full-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-linux-x64-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout the dispatched branch
        uses: actions/checkout@v4
      - name: Build full seed and run native gates
        run: bash scripts/build-linux-x64-full.sh
      - name: Upload the complete tested seed
        uses: actions/upload-artifact@v4
        with:
          name: v8-linux-x64-15.3.76.24-full
          path: artifacts/v8-linux-x64-15.3.76.24-full.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
